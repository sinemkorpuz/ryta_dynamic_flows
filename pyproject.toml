[project]
name = "agentic-project-template"
version = "0.1.0"
description = "Template for multi-user, contract-first agentic development"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "google-adk>=2.9.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "google-auth>=2.58.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.hatch.build.targets.wheel]
packages = ["dev"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
]
